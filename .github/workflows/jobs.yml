on:
  workflow_dispatch:
jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - run:  "echo job ${{ github.job}}"
  job_x:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run:  |
         print $ENV
        shell: perl {0}
  dockerized_job:
    runs-on: ubuntu-latest
    needs: job_1
    container:
      image: node:20
    steps:
      - run:  "echo job ${{ github.job}}"
      - run: echo " hello this run from node container"
  private_docker_image_job:
    runs-on: ubuntu-latest
    needs: job_1
    container:
      image: ghcr.io/username/private-image:tag
      credentials:
        username: ${{ github.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run:  "echo job ${{ github.job}}"
      - run: echo " hello this run from private docker container"
